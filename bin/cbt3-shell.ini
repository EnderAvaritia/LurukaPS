[shell]
; Only /version/client/patchV1 is redirected; other API/CDN URLs stay original.
api_url=http://127.0.0.1:20001
; Empty disables the configured upload endpoint. No token/request body logging.
log_url=
; LurukaPS exposes plain TCP; disable client KCP/TLS getters.
tcp_only=1
; Optional Evergreen camera fade behavior; on by default.
disable_camera_fade=1
; Optional prefilled local account. The native dialog is shown on each launch.
open_id=
