  optional string text = 2 [json_name = "text"];
  repeated uint64 args = 3 [json_name = "args"];
}
message PlayerTextModify {
  optional uint32 type = 1 [json_name = "type"];
  repeated uint64 args = 2 [json_name = "args"];
}
message PlayerTextModifyNotify {
  repeated .cs.PlayerTextModify modify = 1 [json_name = "modify"];
  optional bool all = 2 [json_name = "all"];
  optional string reason = 3 [json_name = "reason"];
}
message ConfReloadEventEscBg {
  repeated uint32 removed_ids = 1 [json_name = "removedIds"];
  repeated uint32 opend_ids = 2 [json_name = "opendIds"];
}
message ConfReloadEventNotify {
  optional .cs.ConfReloadEventEscBg esc_bg = 1 [json_name = "escBg"];
}
message MapRefreshProgress {
  optional uint32 condition_id = 1 [json_name = "conditionId"];
  optional uint32 condition_val = 2 [json_name = "conditionVal"];
}
message RefreshProgress {
  optional uint32 group_id = 1 [json_name = "groupId"];
  repeated .cs.MapRefreshProgress proposal_progress = 2 [json_name = "proposalProgress"];
  optional bool is_unlock = 3 [json_name = "isUnlock"];
  optional uint64 unlockTime = 4 [json_name = "unlockTime"];
}
